[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-lightfm"
version = "0.1.0"
description = "Mojo kernels for LightFM hybrid matrix factorization"
requires-python = ">=3.11"
dependencies = ["numpy<2", "scipy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
